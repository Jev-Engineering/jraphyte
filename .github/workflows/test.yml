name: offline-contracts-and-reference-runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install Pillow==12.2.0 PyMuPDF==1.28.0
      - run: python tools/run_validation.py
      - run: python -m pip install --no-deps .
      - run: trace-gc --version
  domain-distribution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt build==1.2.2.post1
      # `python -m build` builds the sdist first, then the wheel from that sdist.
      - run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Validate the installed wheel from outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          wheel=$(ls "$RUNNER_TEMP"/dist/*.whl)
          test "$(ls "$RUNNER_TEMP"/dist/*.tar.gz | wc -l)" = 1
          python "$GITHUB_WORKSPACE/tools/validate_domain_wheel.py" --wheel "$wheel" --report "$RUNNER_TEMP/domain-wheel-report.json"
          # The reviewed legacy core is an external input and is never vendored: legacy must be reported NOT_RUN here.
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['status']=='PASS' and r['pinned_legacy']['status']=='NOT_RUN', r" "$RUNNER_TEMP/domain-wheel-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: domain-wheel-report-${{ matrix.python-version }}
          path: ${{ runner.temp }}/domain-wheel-report.json
