name: offline-contracts-and-reference-runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install Pillow==12.2.0 PyMuPDF==1.28.0
      - run: python tools/run_validation.py
      - run: python -m pip install --no-deps .
      - run: trace-gc --version
  native-windows-verifier-closure:
    # Real NTFS junction/reparse-point, case, process-tree (Job Object) and interpreter behavior for the
    # external verifier closure; the Linux job above runs the same tests inside the full validation.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install Pillow==12.2.0 PyMuPDF==1.28.0
      - run: python -m unittest discover -s tests -p "test_paper_verifier_closure_v1.py" -v
