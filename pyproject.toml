[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-gc"
version = "0.4.0"
description = "Evidence-bound graph compilation with bidirectional GraphRAG and isolated reference runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "cryptography==46.0.4"]

[project.scripts]
trace-gc = "trace_gc.cli:main"

[tool.setuptools.packages.find]
include = ["trace_gc*"]

[tool.setuptools.package-data]
trace_gc = ["data/schemas/*.json", "data/research_domains/*.json"]
